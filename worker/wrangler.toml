name = "skillhub-readme-translator"
main = "src/index.ts"
compatibility_date = "2026-09-01"

[vars]
MODEL_API_URL = ""
MODEL_NAME = ""
ALLOWED_ORIGINS = "https://yyr-465.github.io,http://localhost:1420,http://127.0.0.1:1420"

[secrets]
required = ["MODEL_API_KEY"]

[[ratelimits]]
name = "TRANSLATION_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
head_sampling_rate = 1
