name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  signing-required:
    name: Production signing required
    runs-on: ubuntu-latest
    steps:
      - name: Block unsigned production release
        shell: bash
        run: |
          echo "::error::Production releases are blocked until SignPath Foundation onboarding and Authenticode signing are configured."
          echo "::error::Do not publish Windows installers from a version tag without both Authenticode and Tauri updater signature verification."
          exit 1
