name: Deploy Web to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run test:readme
      - run: pnpm run test:catalog
      - run: pnpm run test:worker
      - run: pnpm run typecheck:worker
      - run: pnpm run build:web
      - name: Verify committed catalog is current
        run: |
          if ! git diff --exit-code -- public/catalog || [ -n "$(git ls-files --others --exclude-standard -- public/catalog)" ]; then
            echo "::error::Catalog snapshot is stale. Run pnpm run build:web and commit public/catalog/."
            exit 1
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
